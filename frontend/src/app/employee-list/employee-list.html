@if (employees().length > 0) {
<table mat-table [dataSource]="employees()" class="employee-table">
  <ng-container matColumnDef="index">
    <th mat-header-cell *matHeaderCellDef class="col-index">Nº</th>
    <td mat-cell *matCellDef="let employee; let i = index" class="col-index">
      {{ (i + 1).toString().padStart(2, '0') }}
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let employee" class="col-name">{{ employee.name }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>E-mail</th>
    <td mat-cell *matCellDef="let employee" class="col-email">{{ employee.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Cargo</th>
    <td mat-cell *matCellDef="let employee">{{ employee.role }}</td>
  </ng-container>

  <ng-container matColumnDef="salary">
    <th mat-header-cell *matHeaderCellDef>Salário</th>
    <td mat-cell *matCellDef="let employee" class="col-data">{{ employee.salary | currency: 'BRL' }}</td>
  </ng-container>

  <ng-container matColumnDef="hireDate">
    <th mat-header-cell *matHeaderCellDef>Admissão</th>
    <td mat-cell *matCellDef="let employee" class="col-data">{{ employee.hireDate | date: 'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="col-actions">Ações</th>
    <td mat-cell *matCellDef="let employee" class="col-actions">
      <button mat-icon-button type="button" [attr.aria-label]="'Editar ' + employee.name" (click)="edit.emit(employee)">
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="action-danger"
        [attr.aria-label]="'Remover ' + employee.name"
        (click)="remove.emit(employee)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
} @else {
<div class="empty-state">
  <p>{{ emptyMessage() }}</p>
</div>
}
